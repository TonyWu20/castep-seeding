[package]
name = "castep-seeding"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Create seeding files for castep calculation jobs"

[dependencies]
castep-cell-io = "0.7.0"
castep-cell-fmt = "0.3.0"
castep-periodic-table = "0.5.2"
glob = "0.3.1"
thiserror = "2.0.8"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10.0"
indicatif = { version = "0.17.11", features = ["rayon"] }
derive_builder = "0.20.2"
castep-seeding-derive = { path = "castep-seeding-derive" }

[features]
default = ["template"]
template = []
md = []
optics = []
ts_search = []
phonon = []
elec_field = []
nmr = []
elec_excitations = []
solvation_energy = []
